<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список альбомов</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="main-container">
    <h1>Список альбомов</h1>

    <div class="select-block">
        <label for="albumDropdown">Выберите альбом:</label>
        <select id="albumDropdown">
            <option value="">Загрузка...</option>
        </select>
    </div>

    <p id="loadingText" class="hidden">Загрузка данных...</p>
    <p id="errorText" class="hidden"></p>

    <div id="contentBlock" class="hidden">
        <div id="userCard" class="user-info"></div>
        
        <h2>Фотографии</h2>
        <div id="photoGallery" class="gallery"></div>
    </div>
</div>

</body>
</html>
